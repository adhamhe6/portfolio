<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.nav == 'home' %}{% assign full_title = site.title | append: ' · ' | append: site.role %}{% else %}{% assign full_title = page.title | append: ' · ' | append: site.title %}{% endif %}
<title>{{ full_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta name="author" content="{{ site.author }}">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1113" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}

<meta property="og:type" content="{% if page.nav == 'home' %}profile{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ full_title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/adham.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@adhamhe6">

<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/adham.jpg' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

<script>
  document.documentElement.classList.add('js');
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>

{% if page.nav == 'home' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author }}",
  "jobTitle": "{{ site.role }}",
  "url": "{{ '/' | absolute_url }}",
  "image": "{{ '/assets/img/adham.jpg' | absolute_url }}",
  "email": "mailto:{{ site.email }}",
  "address": { "@type": "PostalAddress", "addressLocality": "Cairo", "addressCountry": "EG" },
  "alumniOf": { "@type": "CollegeOrUniversity", "name": "Mansoura University" },
  "knowsAbout": ["Python", "FastAPI", "Django", "PostgreSQL", "Redis", "REST APIs", "System design", "LLM integration", "RAG", "AWS", "Docker"],
  "sameAs": [{% for s in site.data.social %}"{{ s.url }}"{% unless forloop.last %}, {% endunless %}{% endfor %}]
}
</script>
{% endif %}
