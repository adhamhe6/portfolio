<header class="site-header">
  <nav class="nav container" aria-label="Primary">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author }}, home">
      <span class="brand-mark" aria-hidden="true">AH</span>
      <span class="brand-text">
        <span class="brand-name">{{ site.author }}</span>
        <span class="brand-role">{{ site.role }}</span>
      </span>
    </a>

    <div class="nav-actions">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span class="sr-only">Menu</span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>
    </div>

    <div class="nav-menu" id="nav-menu">
      <ul class="nav-links">
        {% for item in site.data.nav %}{% unless item.key == 'home' %}
        <li><a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endunless %}{% endfor %}
      </ul>
      <div class="nav-tools">
        <button class="palette-trigger" type="button" data-palette-open aria-label="Open quick navigation">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <span class="palette-trigger-label">Jump to…</span>
          <kbd class="kbd" data-mod-key>Ctrl K</kbd>
        </button>
        <button class="theme-toggle" type="button" aria-label="Switch colour theme">
          <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>
  </nav>
</header>
