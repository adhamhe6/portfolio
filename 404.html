<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Adham Hewala</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/portfolio/assets/img/404.png" type="image/png">
  <style>
    :root { --bg:#fff; --text:#0f1a1f; --muted:#4d5d66; --accent:#0f766e; --accent-contrast:#fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1215; --text:#e7eef1; --muted:#a3b3ba; --accent:#2dd4bf; --accent-contrast:#062421; color-scheme: dark; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent); font-size: .95rem; }
    h1 { margin: 12px 0 8px; font-size: 2rem; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0 0 28px; }
    a { display:inline-block; padding:12px 20px; border-radius:8px; background:var(--accent); color:var(--accent-contrast); font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <code>HTTP 404</code>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a href="/portfolio/">Back to the homepage</a>
  </main>
</body>
</html>
